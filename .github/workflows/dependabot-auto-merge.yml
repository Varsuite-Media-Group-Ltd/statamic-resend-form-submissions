name: Dependabot auto-merge

# Turns Dependabot security PRs into merges without a human in the loop.
#
# How the safety actually works, so this is not mistaken for more than it is:
# `gh pr merge --auto` asks GitHub to merge the PR once its required status
# checks pass. If this repository has required status checks configured, the
# merge waits for them and a red build blocks it. If it has none, there is
# nothing to wait for and GitHub merges straight away.
#
# So on a repo with CI this is "merge when green"; on a repo without CI it is
# "merge on arrival". If you want the former, the lever is adding required
# status checks to the branch protection rule, not editing this file.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEP_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          echo "::notice::${DEP_NAMES} (${UPDATE_TYPE})"

          # Repositories differ on which merge methods they permit, so try the
          # tidiest first and fall back rather than failing the run.
          for method in squash merge rebase; do
            if gh pr merge --auto "--${method}" "$PR_URL"; then
              echo "::notice::auto-merge enabled via ${method}"
              exit 0
            fi
          done

          echo "::error::Could not enable auto-merge for $PR_URL."
          echo "Check that the repository allows auto-merge and at least one merge method."
          exit 1
